name: 'Update schedule'

on:
  # 强烈建议保持 schedule 注释状态，防止账号被 GitHub 封禁风控！
  # schedule:
  #   - cron: '0 22 * * *'
  workflow_dispatch: # 开启手动点击触发功能

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: myConfig
          fetch-depth: 2 # 【关键修复】：必须设置为 2 或以上，否则后续 git reset HEAD^ 会报错
          
      - name: Run with setup-python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'
          
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - name: Install pipenv
        run: pip3 install --user pipenv
        
      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy
        
      - name: Update
        run: pipenv run dev
        
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add . # 【修改】：使用 . 包含所有变动文件
          
          # 【关键修复】：判断是否有文件变动，有变动才覆盖提交，避免因无改动导致报错中断
          if [ -n "$(git status --porcelain)" ]; then
            git reset --soft HEAD^
            git commit -m "Github Action Auto Updated"
            git push -f origin myConfig
            echo "GitHub repository updated."
          else
            echo "No changes detected for GitHub. Skipping commit."
          fi

      - name: Sync output folder to Gitee via HTTPS
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config --global user.name "${GITEE_USER}"
          git config --global user.email "${GITEE_USER}@users.noreply.github.com"
          
          git clone https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/gordon85/Gordon85_IPTV.git temp_gitee_repo
          cd temp_gitee_repo
          
          git checkout master
          
          mkdir -p output
          rsync -av --delete $GITHUB_WORKSPACE/output/ ./output/
          
          if [ -n "$(git status --porcelain)" ]; then
            git add output/
            git commit -m "chore: auto-sync output folder from GitHub Actions"
            git push origin master
            echo "✅ 成功推送到 Gitee！"
          else
            echo "⚠️ Gitee 端无文件变动，跳过推送。"
          fi
