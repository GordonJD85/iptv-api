name: 'Update schedule'

on:
  workflow_dispatch:

jobs:
  test-gitee:
    runs-on: ubuntu-latest
    steps:
      # 测试 Gitee 认证
      - name: Test Gitee Token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          echo "测试 Gitee Token 是否有效..."
          
          # 使用 curl 访问 Gitee API
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GITEE_TOKEN" \
            "https://gitee.com/api/v5/user"
          
          # 检查 HTTP 状态码是否为 200
          if [ $? -eq 0 ] && [ $? -eq 200 ]; then
            echo "✅ Gitee Token 有效！"
          else
            echo "❌ Gitee Token 无效或权限不足！"
            exit 1
          fi
