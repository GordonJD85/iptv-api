name: 'Update schedule'

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: # 开启手动点击触发功能
jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: myConfig
          
      - name: Run with setup-python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pipenv
        run: pip3 install --user pipenv
      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy
      - name: Update
        run: pipenv run dev
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *
          git reset --soft HEAD^
          git commit -m "Github Action Auto Updated"
          git push -f origin myConfig

      - name: Sync output folder to Gitee via HTTPS
        env:
          # 读取你在 GitHub 设置的 Secrets
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 1. 配置 Git 提交身份 (直接使用你配置的用户名)
          git config --global user.name "${GITEE_USER}"
          git config --global user.email "${GITEE_USER}@users.noreply.github.com"
          
          # 2. 克隆 Gitee 目标仓库到临时目录 (使用 HTTPS 结合 Token 认证)
          git clone https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/gordon85/Gordon85_IPTV.git temp_gitee_repo
          cd temp_gitee_repo
          
          # 3. 确保在 master 分支
          git checkout master
          
          # 4. 同步文件 (使用 rsync 保持 output 目录完全一致)
          mkdir -p output
          rsync -av --delete $GITHUB_WORKSPACE/output/ ./output/
          
          # 5. 检查变动并提交推送
          if [ -n "$(git status --porcelain)" ]; then
            git add output/
            git commit -m "chore: auto-sync output folder from GitHub Actions"
            git push origin master
            echo "✅ 同步成功！"
          else
            echo "⚠️ 没有检测到文件变动，跳过推送。"
          fi
