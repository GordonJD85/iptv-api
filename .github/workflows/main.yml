name: Sync output to Gitee

on:
  workflow_dispatch:  # 手动触发
  
  # 如果需要定时触发，可以添加 schedule
  # schedule:
  #   - cron: '0 2 * * *'  # 每天 UTC 时间 2:00 运行

jobs:
  sync-output:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          repository: GordonJD85/iptv-api
          ref: myConfig
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync output directory to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          echo "开始同步 GitHub 的 output 目录到 Gitee..."
          
          # 检查 output 目录是否存在
          if [ ! -d "output" ]; then
            echo "错误: GitHub 仓库的 myConfig 分支中不存在 output 目录"
            exit 1
          fi
          
          echo "GitHub 仓库 output 目录内容:"
          ls -la output/
          
          # 克隆 Gitee 仓库
          echo "克隆 Gitee 仓库 (Gordon85_IPTV) 的 master 分支..."
          git clone --branch master --depth 1 https://gitee.com/gordon85/Gordon85_IPTV.git gitee_repo
          cd gitee_repo
          
          # 配置 Git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # 清空 Gitee 的 output 目录
          echo "清空 Gitee 仓库的 output 目录..."
          rm -rf output/*
          
          # 复制 GitHub 的 output 目录内容
          echo "复制 GitHub 的 output 目录内容..."
          cp -r ../../output/* output/ 2>/dev/null || :
          
          # 如果 output 目录为空，创建一个占位文件
          if [ -z "$(ls -A output/)" ]; then
            echo "output 目录为空，创建 .keep 文件"
            touch output/.keep
          fi
          
          echo "Gitee 仓库 output 目录更新后内容:"
          ls -la output/
          
          # 检查是否有变化
          git status
          
          # 提交并推送到 Gitee
          git add output/
          
          if git diff --cached --quiet; then
            echo "output 目录无变化，无需推送"
          else
            echo "提交更改..."
            git commit -m "Sync output directory from GitHub iptv-api:myConfig $(date '+%Y-%m-%d %H:%M:%S')"
            
            echo "推送到 Gitee..."
            git push https://$GITEE_TOKEN@gitee.com/gordon85/Gordon85_IPTV.git master
          fi
          
          # 清理临时文件
          echo "清理临时文件..."
          cd ..
          rm -rf gitee_repo
          
          echo "同步完成！"
