name: 'Update schedule'

on:
  workflow_dispatch:

jobs:
  validate-token:
    runs-on: ubuntu-latest
    steps:
      - name: Check Gitee Token Validity
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          echo "正在验证 Gitee Token..."
          
          # 使用 curl 发送请求并捕获 HTTP 状态码
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITEE_TOKEN" \
            "https://gitee.com/api/v5/user")
          
          # 检查 HTTP 状态码是否为 200（成功）
          if [ "$HTTP_CODE" == "200" ]; then
            echo "✅ Gitee Token 有效！"
          else
            echo "❌ Gitee Token 无效或权限不足！"
            echo "错误详情：HTTP 状态码 $HTTP_CODE"
            exit 1
          fi
